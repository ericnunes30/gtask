name: Trigger Issue Classifier

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Post classification trigger comment
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "/classify"
        env:
          # AQUI ESTÁ A MUDANÇA
          GITHUB_TOKEN: ${{ secrets.PAT }}
