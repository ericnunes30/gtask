name: Trigger Issue Classifier

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read # <-- Permissão adicionada para o checkout

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # <-- PASSO ADICIONADO

      - name: Post classification trigger comment
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "/classify"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
