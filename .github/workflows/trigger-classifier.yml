name: Trigger Issue Classifier

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Prompt and Post Comment
        run: |
          # Usamos um "heredoc" para criar um texto de múltiplas linhas facilmente
          PROMPT=$(cat <<'EOF'
          #opencode-run
          You are a GitHub issue triage expert.
          Analyze the following issue and return a JSON object with two keys: "type" and "priority".

          Issue Title: "${{ github.event.issue.title }}"
          Issue Body:
          ${{ github.event.issue.body }}

          For the "type" key, choose one of these values: "bug", "enhancement", "documentation", "question".
          For the "priority" key, choose one of these values: "p0", "p1", "p2", "p3".

          Respond with ONLY the raw JSON object. Example: {"type": "bug", "priority": "p1"}
          EOF
          )
          gh issue comment ${{ github.event.issue.number }} --body "$PROMPT"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }} # Importante continuar usando o PAT aqui
