name: Classify and Prioritize Issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  classify_and_prioritize:
    # Apenas executa se o comentário for o nosso gatilho
    if: github.event.comment.body == '/classify'
    runs-on: ubuntu-latest
    steps:
      # Nós precisamos "construir" o prompt que será lido pelo opencode
      # A ação vai ler o corpo do comentário que a acionou.
      - name: Update comment with full instructions
        id: prompt
        run: |
          # O prompt é o texto que a IA irá ler.
          # Note que estamos passando as informações da issue dentro do prompt.
          PROMPT="""
          You are a GitHub issue triage expert.
          Analyze the following issue and return a JSON object with two keys: "type" and "priority".

          Issue Title: "${{ github.event.issue.title }}"
          Issue Body:
          ${{ github.event.issue.body }}

          For the "type" key, choose one of these values: "bug", "enhancement", "documentation", "question".
          For the "priority" key, choose one of these values: "p0", "p1", "p2", "p3".

          Respond with ONLY the raw JSON object. Example: {"type": "bug", "priority": "p1"}
          """
          # Nós editamos o comentário de gatilho para conter o prompt completo
          gh issue comment ${{ github.event.issue.number }} --edit ${{ github.event.comment.id }} --body "$PROMPT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Run Opencode AI
        id: opencode
        # A ação irá ler o comentário que foi atualizado no passo anterior
        uses: sst/opencode/github@latest
        with:
          model: Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8

      - name: Apply Labels
        if: steps.opencode.outputs.result != ''
        run: |
          JSON_RESULT='${{ steps.opencode.outputs.result }}'
          TYPE_LABEL=$(echo $JSON_RESULT | jq -r .type)
          PRIORITY_LABEL=$(echo $JSON_e_result | jq -r .priority)

          echo "Applying labels: $TYPE_LABEL, $PRIORITY_LABEL"
          gh issue edit ${{ github.event.issue.number }} --add-label "$TYPE_LABEL,$PRIORITY_LABEL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Clean up comment
        if: always() # Executa mesmo se os passos anteriores falharem
        run: |
          gh issue comment ${{ github.event.issue.number }} --edit ${{ github.event.comment.id }} --body "Classificação concluída."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
