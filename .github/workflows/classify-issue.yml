name: Classify and Prioritize Issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  classify_and_prioritize:
    # Aciona se o comentário começar com a nossa frase-chave
    if: startsWith(github.event.comment.body, '#opencode-run')
    runs-on: ubuntu-latest
    steps:
      - name: Run Opencode AI
        id: opencode
        # A ação vai ler automaticamente o corpo do comentário que a acionou
        uses: sst/opencode/github@latest
        with:
          model: Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8

      - name: Apply Labels
        if: steps.opencode.outputs.result != ''
        run: |
          # Adicionamos uma verificação para garantir que o resultado é um JSON válido
          JSON_RESULT='${{ steps.opencode.outputs.result }}'
          if ! echo "$JSON_RESULT" | jq .; then
            echo "Error: AI did not return a valid JSON."
            exit 1
          fi
          
          TYPE_LABEL=$(echo "$JSON_RESULT" | jq -r .type)
          PRIORITY_LABEL=$(echo "$JSON_RESULT" | jq -r .priority)

          echo "Applying labels: $TYPE_LABEL, $PRIORITY_LABEL"
          gh issue edit ${{ github.event.issue.number }} --add-label "$TYPE_LABEL,$PRIORITY_LABEL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Usamos o token padrão aqui

      - name: Add reaction to acknowledge completion
        if: always() # Executa mesmo se os passos anteriores falharem
        run: |
          gh reaction add --comment ${{ github.event.comment.id }} -c hooray
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
