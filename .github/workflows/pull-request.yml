name: PR Reviewer

# Aciona apenas na abertura ou atualização de um Pull Request
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # Adicionado para permitir comentários no PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Faz o checkout do código do PR
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run opencode on PR
        uses: sst/opencode/github@latest
        with:
          # ATENÇÃO: Verifique se este é o nome correto do modelo para esta tarefa
          model: chutes/moonshotai/Kimi-K2-Instruct-0905
          # Exemplo de prompt para revisar um PR. Ajuste conforme sua necessidade.
          prompt: |
            /opencode
            You are an expert code reviewer.
            Review the following pull request for potential bugs, style issues, and improvements.
            Provide a concise summary of your findings.
