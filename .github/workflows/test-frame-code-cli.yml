name: Test Frame Code CLI

on:
  workflow_dispatch:

jobs:
  test-frame-code-cli:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - Check frame-code installation
        run: |
          echo "Checking for frame-code in PATH:"
          which frame-code || echo "frame-code not found in PATH"
          echo "Checking installation directory:"
          ls -l /usr/local/lib/node_modules/frame-code-cli || echo "No frame-code-cli installed"
          echo "PATH: $PATH"
          echo "Node.js version:"
          node --version
          echo "npm version:"
          npm --version
      
      - name: Test Frame Code CLI
        run: frame-code --version
