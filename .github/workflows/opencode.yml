name: opencode

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  request:
    if: |
      github.event_name == 'pull_request' || contains(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode') || startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      # A permissão 'issues: write' não é mais estritamente necessária aqui,
      # mas pode ser mantida para flexibilidade futura.
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run opencode
        uses: aemr3/opencode/github@dev
        env:
          CHUTES_API_KEY: ${{ secrets.CHUTES_API_KEY }}
        with:
          model: chutes/moonshotai/Kimi-K2-Instruct-0905
          language: "pt"
